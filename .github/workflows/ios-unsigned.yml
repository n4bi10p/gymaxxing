name: iOS unsigned IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Archive without signing
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Gymaxxing.xcworkspace \
            -scheme Gymaxxing \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Gymaxxing.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/Gymaxxing.xcarchive/Products/Applications/Gymaxxing.app" Payload/
          zip -r Gymaxxing-unsigned.ipa Payload
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/mobile/ios/Gymaxxing-unsigned.ipa
